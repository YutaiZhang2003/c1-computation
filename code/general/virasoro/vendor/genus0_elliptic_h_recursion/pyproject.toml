[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genus0-elliptic-h-recursion"
version = "0.1.0"
description = "Fixed-difference elliptic h-recursion for genus-zero Virasoro n-point comb blocks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["mpmath>=1.2"]
authors = [{name = "Research implementation"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[tool.setuptools.packages.find]
where = ["src"]
